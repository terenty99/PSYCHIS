<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <style>
      .link-curve {
        fill: none;
        stroke: #4A4540;
        stroke-width: 6;
        stroke-linecap: round;
      }
      .node-point {
        fill: #4A4540;
      }
      .brand-title {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Space Grotesk", sans-serif;
        font-size: 22px;
        font-weight: 400;
        fill: #4A4540;
        letter-spacing: 9px;
      }
      .brand-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Space Grotesk", sans-serif;
        font-size: 7.5px;
        font-weight: 500;
        fill: #4A4540;
        fill-opacity: 0.65;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Centered Mark Group -->
  <g transform="translate(96, 44)">
    <path
      class="link-curve"
      d="M 30,98 C 76,96 92,56 98,30"
    />
    <circle class="node-point" cx="30" cy="98" r="5.2" />
    <circle class="node-point" cx="98" cy="30" r="5.2" />
  </g>

  <!-- Brand Typography -->
  <text class="brand-title" x="160" y="224" text-anchor="middle">PSYCHIS</text>
  <text class="brand-subtitle" x="160" y="246" text-anchor="middle">SPATIAL KNOWLEDGE ENGINE</text>
</svg>
